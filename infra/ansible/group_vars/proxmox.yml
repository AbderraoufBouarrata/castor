# =============================================================================
# Settings for the Proxmox host. Override any of them on the command line:
#   ansible-playbook playbooks/k8s-node-template.yml -e k8s_node_template_vmid=9100
#
# Names, VMIDs and tags follow docs/architecture.md, "VMs and templates".
# =============================================================================

# -----------------------------------------------------------------------------
# Proxmox
# -----------------------------------------------------------------------------

# Storage for VM disks and the cloud-init drive. List yours: pvesm status
proxmox_storage: local-lvm

# Network bridge the VMs attach to. List yours: ip -br link | grep vmbr
proxmox_bridge: vmbr0

# Resource pool every Castor VM and template joins. The playbooks create it if
# it is missing and use it as-is if it already exists.
proxmox_pool: castor
proxmox_pool_comment: "Castor build service: templates, k8s nodes, ephemeral workers"

# Tags on every template.
template_tags: castor;template

# -----------------------------------------------------------------------------
# k8s node template: Ubuntu + cloud-init + qemu-guest-agent
# Cloned by Terraform for the k8s nodes, and the starting point of the
# ephemeral worker template.
# -----------------------------------------------------------------------------

k8s_node_template_vmid: 9000
k8s_node_template_name: castor-k8s-node-template

# -----------------------------------------------------------------------------
# Ephemeral worker template: k8s node template + Docker + worker agent
# Cloned by the dispatcher, one ephemeral worker per job. Playbook not written yet.
# -----------------------------------------------------------------------------

ephemeral_worker_template_vmid: 9001
ephemeral_worker_template_name: castor-ephemeral-worker-template

# -----------------------------------------------------------------------------
# Terraform access: user, role, token (playbooks/terraform-access.yml)
# -----------------------------------------------------------------------------

proxmox_node: pve

terraform_user: terraform@pve
terraform_token_id: castor
terraform_role: CastorTerraform

# Minimum Terraform needs to clone the k8s node template into a k8s node and
# manage it. Proxmox VE 9 names: VM.Monitor no longer exists; the guest agent
# (used to read the VM's IP) is VM.GuestAgent.Audit.
terraform_privileges:
  - Datastore.AllocateSpace
  - Datastore.Audit
  - Pool.Allocate
  - Pool.Audit
  - SDN.Use
  - Sys.Audit
  - VM.Allocate
  - VM.Audit
  - VM.Clone
  - VM.Config.CDROM
  - VM.Config.Cloudinit
  - VM.Config.CPU
  - VM.Config.Disk
  - VM.Config.HWType
  - VM.Config.Memory
  - VM.Config.Network
  - VM.Config.Options
  - VM.GuestAgent.Audit
  - VM.PowerMgmt

# Where the role applies. Nothing outside these paths: Terraform cannot see or
# touch your personal VMs.
terraform_acl_paths:
  - /pool/{{ proxmox_pool }}                  # Castor VMs and templates
  - /storage/{{ proxmox_storage }}            # disks and cloud-init drives
  - /sdn/zones/localnetwork/{{ proxmox_bridge }} # plug NICs into the bridge
  - /nodes/{{ proxmox_node }}                 # read node status

# Terraform reads the token from here (git-ignored), on your laptop.
terraform_secrets_file: "{{ playbook_dir }}/../../terraform/secrets.auto.tfvars"

# -----------------------------------------------------------------------------
# Ubuntu cloud image
# -----------------------------------------------------------------------------

# Ubuntu 24.04 LTS (noble), verified against Canonical's SHA256SUMS.
ubuntu_image_url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
ubuntu_image_checksum: sha256:https://cloud-images.ubuntu.com/noble/current/SHA256SUMS

# Where the download is kept on the host (reused on rebuilds).
ubuntu_image_cache: /var/lib/vz/template/cache/noble-server-cloudimg-amd64.img
